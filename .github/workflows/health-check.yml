name: Windows-Health-Check

on:
  workflow_dispatch:            # manuell starten (Actions -> Run workflow)
  schedule:
    - cron: '0 6 * * 1'         # automatisch jeden Montag um 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/health-check.yml'

permissions:
  contents: write               # erlaubt, den Bericht ins Repository zu speichern

jobs:
  health-check:
    runs-on: windows-latest     # Windows Server in der Cloud von GitHub
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Health-Check ausfuehren
        shell: powershell
        run: .\src\Invoke-HealthCheck.ps1 -OutputPath .\reports

      - name: Bericht als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: reports/

      - name: Bericht im Repository aktualisieren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Health-Report $(date -u +%Y-%m-%d)"
          git push
